<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinEdvise — Smarter Financial Decisions for Education</title>
  <meta name="description" content="FinEdvise helps private educational institutions make smarter financial decisions, manage uncertainty, and grow sustainably.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="authRoot" hidden></div>
  <header class="topbar" hidden>
    <div class="brand">
      <img src="/favicon.svg" alt="" width="34" height="34">
      <div class="brand-text">
        <div class="brand-name">FinEdvise</div><div class="brand-tagline">Smarter Financial Decisions for Education.</div>
        <div class="brand-school" id="school"></div>
      </div>
    </div>
    <div class="controls" id="controls"></div>
  </header>
  <div class="shell" hidden>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <main id="main" tabindex="-1">
      <section class="page" id="page-home"></section>
      <section class="page" id="page-plan" hidden></section>
      <section class="page" id="page-copilot" hidden></section>
      <section class="page" id="page-financing" hidden></section>
      <section class="page" id="page-approvals" hidden></section>
      <section class="page" id="page-records" hidden></section>
      <section class="page" id="page-security" hidden></section>
      <section class="page" id="page-extras" hidden></section>
      <section class="page" id="page-team" hidden></section>
    </main>
  </div>
  <script src="/i18n.js"></script>
  <script src="/charts.js"></script>
  <script src="/app.js"></script>
</body>
</html>
